name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff 要遍历完整历史才能生成更新说明。
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # tag 是「已发布版本」的权威来源。加载器、DLL 元数据和运行时能力标记必须与它一致。
      - name: 校验 tag 与包内版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep -oP '"version"\s*:\s*"\K[^"]+' GameplayConfigSync.json | head -1)"
          project="$(dotnet msbuild GameplayConfigSync.csproj -getProperty:Version)"
          runtime="$(grep -oP 'public const string Version = "\K[^"]+' src/Main.cs | head -1)"
          echo "tag=$tag manifest=$manifest csproj=$project runtime=$runtime"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$project" ] || [ "$tag" != "$runtime" ]; then
            echo "::error::标签、manifest、csproj 与运行时版本不一致"
            exit 1
          fi

      - name: 构建
        run: dotnet build -c Release

      - name: 生成更新说明
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.cliff.outputs.content }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 产物在 dist/GameplayConfigSync/ 下；附件按文件名平铺上传，
          # 下载者拿到的仍是 GameplayConfigSync.dll / .json 两个文件。
          files: dist/GameplayConfigSync/*
